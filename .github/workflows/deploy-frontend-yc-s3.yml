name: Deploy Frontend to Object Storage

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Frontend app name under vite-apps/apps/<name>'
        required: true
        type: string
      bucket_name:
        description: 'Object Storage bucket name'
        required: false
        default: 'mv-dating'
        type: string
      update_latest:
        description: 'Update latest version (for production deployments)'
        required: false
        default: true
        type: boolean
      build_command:
        description: 'Build command (default: npm run build -w <app> in vite-apps, use {app} placeholder)'
        required: false
        default: 'npm run build -w @apps/{app}'
        type: string
      build_output:
        description: 'Build output directory (default: dist)'
        required: false
        default: 'dist'
        type: string

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate application exists
        id: app_path
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_DIR="vite-apps/apps/$APP_NAME"
          if [ ! -d "$APP_DIR" ]; then
            echo "❌ Application '$APP_DIR' not found!"
            echo "Available:"
            ls -1 vite-apps/apps 2>/dev/null || echo "(empty)"
            exit 1
          fi
          echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Application found: $APP_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vite-apps/package-lock.json

      - name: Install dependencies
        working-directory: vite-apps
        run: npm ci

      - name: Build frontend
        working-directory: vite-apps
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          BUILD_CMD="${{ github.event.inputs.build_command }}"
          BUILD_CMD=$(echo "$BUILD_CMD" | sed "s/{app}/$APP_NAME/g")
          echo "🔨 Running: $BUILD_CMD"
          eval "$BUILD_CMD"
        env:
          NODE_ENV: production

      - name: Validate build output
        run: |
          BUILD_OUTPUT="${{ github.event.inputs.build_output }}"
          APP_DIR="${{ steps.app_path.outputs.dir }}"
          
          if [ ! -d "$APP_DIR/$BUILD_OUTPUT" ]; then
            echo "❌ Error: Build output directory '$BUILD_OUTPUT' not found in '$APP_DIR'"
            echo ""
            echo "Available directories:"
            ls -la "$APP_DIR" || echo "Directory not found"
            exit 1
          fi
          
          echo "✅ Build output found: $APP_DIR/$BUILD_OUTPUT"

      - name: Build bucket name and version
        id: bucket
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          
          if [ -n "${{ github.event.inputs.bucket_name }}" ]; then
            # Используем указанное имя bucket
            BUCKET_NAME="${{ github.event.inputs.bucket_name }}"
          else
            # Формируем имя bucket: owner-reponame-appname
            REPO_OWNER="${{ github.repository_owner }}"
            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            BUCKET_NAME="${REPO_OWNER}-${REPO_NAME}-${APP_NAME}"
          fi
          
          # Используем SHA коммита (первые 8 символов) для версионирования
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          VERSION="$COMMIT_SHA"
          
          echo "name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🌐 Bucket name: $BUCKET_NAME"
          echo "📦 Version: $VERSION"
          echo "🔄 Update latest: ${{ github.event.inputs.update_latest }}"

      - name: Upload files to versioned directory
        uses: yc-actions/yc-obj-storage-upload@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          bucket: ${{ steps.bucket.outputs.name }}
          root: ${{ steps.app_path.outputs.dir }}/${{ github.event.inputs.build_output }}
          prefix: versions/${{ steps.bucket.outputs.version }}/
          include: |
            **/*
        
      - name: Update latest version (root of bucket for hosting)
        if: github.event.inputs.update_latest == 'true'
        uses: yc-actions/yc-obj-storage-upload@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          bucket: ${{ steps.bucket.outputs.name }}
          root: ${{ steps.app_path.outputs.dir }}/${{ github.event.inputs.build_output }}
          # Без prefix - загружаем в корень bucket для хостинга
          # Yandex Object Storage требует, чтобы главная страница была без / в пути
          include: |
            **/*

      - name: Create deployment metadata file
        if: github.event.inputs.update_latest == 'true'
        run: |
          VERSION="${{ steps.bucket.outputs.version }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Создаем временную директорию для файла метаданных
          mkdir -p .deployment-metadata
          
          # Создаем JSON файл с метаинформацией о деплое
          cat > .deployment-metadata/deployment.json << EOF
          {
            "version": "$VERSION",
            "commit": {
              "sha": "$COMMIT_SHA",
              "short": "$(echo $COMMIT_SHA | cut -c1-8)",
              "message": "$(echo "$COMMIT_MESSAGE" | sed 's/"/\\"/g' | head -c 200)"
            },
            "deployedAt": "$DEPLOY_TIME",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          
          echo "📝 Deployment metadata created:"
          cat .deployment-metadata/deployment.json

      - name: Upload deployment metadata to bucket root
        if: github.event.inputs.update_latest == 'true'
        uses: yc-actions/yc-obj-storage-upload@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          bucket: ${{ steps.bucket.outputs.name }}
          root: .deployment-metadata
          # Без prefix - загружаем в корень bucket
          include: |
            deployment.json

      - name: Set bucket URLs
        id: bucket_url
        run: |
          BUCKET_NAME="${{ steps.bucket.outputs.name }}"
          VERSION="${{ steps.bucket.outputs.version }}"
          
          BASE_URL="https://storage.yandexcloud.net/$BUCKET_NAME"
          VERSION_URL="$BASE_URL/versions/$VERSION"
          LATEST_URL="$BASE_URL"
          
          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "version_url=$VERSION_URL" >> $GITHUB_OUTPUT
          echo "latest_url=$LATEST_URL" >> $GITHUB_OUTPUT
          
          echo "🌐 Base URL: $BASE_URL"
          echo "📦 Version URL: $VERSION_URL"
          echo "🔗 Latest URL: $LATEST_URL (root of bucket for hosting)"

      - name: Deployment info
        run: |
          BUCKET_NAME="${{ steps.bucket.outputs.name }}"
          VERSION="${{ steps.bucket.outputs.version }}"
          UPDATE_LATEST="${{ github.event.inputs.update_latest }}"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Frontend deployment completed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Application: ${{ github.event.inputs.app_name }}"
          echo "Bucket: $BUCKET_NAME"
          echo "Version: $VERSION"
          echo "Build output: ${{ github.event.inputs.build_output }}"
          echo ""
          echo "📍 URLs:"
          echo "   Version: ${{ steps.bucket_url.outputs.version_url }}"
          if [ "$UPDATE_LATEST" = "true" ]; then
            echo "   Latest:  ${{ steps.bucket_url.outputs.latest_url }} (updated)"
          else
            echo "   Latest:  not updated (test deployment)"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "💡 Tips:"
          echo "   • Configure hosting: Main page = index.html (in bucket root)"
          echo "   • Latest version is in bucket root (for hosting)"
          echo "   • Use versioned URLs for testing: versions/$VERSION/"
          echo "   • Hosting console: https://console.cloud.yandex.ru/folders/${{ secrets.YC_FOLDER_ID }}/storage/buckets/$BUCKET_NAME/hosting"
          echo ""
          if [ "$UPDATE_LATEST" = "true" ]; then
            echo "📋 Check current production deployment:"
            echo "   • Metadata: curl ${{ steps.bucket_url.outputs.latest_url }}/deployment.json"
            echo ""
          fi
          echo "📚 Version history:"
          echo "   All versions are stored in: s3://$BUCKET_NAME/versions/"
          echo "   Latest (production) is in bucket root for hosting"
          echo "   Deployment metadata: deployment.json in bucket root"

