services:
  vanilla:
    build:
      context: .
      dockerfile: apps/vanilla/Dockerfile
      target: ${DOCKER_TARGET:-development}
    container_name: vanilla
    ports:
      - 3432:3432
    env_file:
      - apps/vanilla/.env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/vanilla
          target: /app/apps/vanilla
        - action: sync
          path: ./packages
          target: /app/packages
  react:
    build:
      context: .
      dockerfile: apps/react/Dockerfile
      target: ${DOCKER_TARGET:-development}
    container_name: react
    ports:
      - 4444:4444
    env_file:
      - apps/react/.env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/react
          target: /app/apps/react
        - action: sync
          path: ./packages
          target: /app/packages
