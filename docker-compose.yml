services:
  react-test:
    build:
      context: .
      dockerfile: apps/react-test/Dockerfile
      target: ${DOCKER_TARGET:-development}
    container_name: react-test
    ports:
      - 5656:5656
    env_file:
      - apps/react-test/.env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/react-test
          target: /app/apps/react-test
        - action: sync
          path: ./packages
          target: /app/packages
