services:
  react:
    build:
      context: .
      dockerfile: apps/react/Dockerfile
      target: ${DOCKER_TARGET:-development}
    container_name: react
    ports:
      - 3434:3434
    env_file:
      - apps/react/.env
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/react
          target: /app/apps/react
        - action: sync
          path: ./packages
          target: /app/packages
