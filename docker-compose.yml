services:
  nestjs:
    build:
      context: .
      dockerfile: apps/nestjs/Dockerfile
      target: ${DOCKER_TARGET:-development}
    container_name: nestjs
    ports:
      - 3434:3434
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/nestjs
          target: /app/apps/nestjs
        - action: sync
          path: ./packages
          target: /app/packages
